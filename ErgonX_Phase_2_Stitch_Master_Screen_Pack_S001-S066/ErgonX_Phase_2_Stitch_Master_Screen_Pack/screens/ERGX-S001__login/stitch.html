<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>ErgonX Desktop - Sign In / Login</title>
<!-- Tailwind CSS CDN with forms and container queries plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Inter Google Font -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind Configuration for Enterprise Branding -->
<script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            brand: {
              navy: '#091526',
              dark: '#0B192C',
              hover: '#13243d',
              cyan: '#00D2FF',
              blue: '#0066FF',
              accent: '#3B82F6',
            }
          }
        }
      }
    }
  </script>
<!-- BEGIN: Custom Aurora & Lighting Styles -->
<style data-purpose="background-mesh">
    body {
      font-family: 'Inter', sans-serif;
      background-color: #F8FAFC;
      overflow-x: hidden;
    }

    /* Abstract glowing translucent organic ribbons and curved mesh */
    .aurora-container {
      position: absolute;
      top: 0;
      right: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
    }

    /* Primary glowing cyan/blue ribbon */
    .aurora-ribbon-1 {
      position: absolute;
      top: -20%;
      right: -15%;
      width: 75vw;
      height: 140vh;
      border-radius: 46% 54% 68% 32% / 38% 49% 51% 62%;
      background: radial-gradient(circle at 40% 50%, rgba(56, 189, 248, 0.45), rgba(37, 99, 235, 0.38) 50%, rgba(147, 51, 234, 0.12) 80%, transparent 100%);
      filter: blur(55px);
      transform: rotate(-18deg);
      opacity: 0.85;
    }

    /* Secondary overlapping translucent wave ribbon */
    .aurora-ribbon-2 {
      position: absolute;
      bottom: -30%;
      right: 5%;
      width: 60vw;
      height: 110vh;
      border-radius: 61% 39% 53% 47% / 45% 65% 35% 55%;
      background: radial-gradient(circle at 60% 40%, rgba(6, 182, 212, 0.4), rgba(59, 130, 246, 0.35) 60%, rgba(216, 180, 254, 0.2) 90%, transparent 100%);
      filter: blur(65px);
      transform: rotate(25deg);
      opacity: 0.75;
    }

    /* Left ambient subtle glow */
    .aurora-glow-soft {
      position: absolute;
      top: 25%;
      left: 10%;
      width: 35vw;
      height: 60vh;
      background: radial-gradient(circle, rgba(186, 230, 253, 0.45) 0%, rgba(224, 242, 254, 0.1) 70%, transparent 100%);
      filter: blur(80px);
    }
  </style>
<style data-purpose="form-enhancements">
    /* Subtle focus border animation & elevation styling */
    .auth-input-container {
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .auth-input-container:focus-within {
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.18), 0 2px 4px rgba(0, 0, 0, 0.04);
      border-color: #3b82f6;
    }
  </style>
<!-- END: Custom Aurora & Lighting Styles -->
</head>
<body class="min-h-screen text-slate-800 flex flex-col justify-between relative selection:bg-cyan-500 selection:text-white">
<!-- BEGIN: Ambient Background Graphics -->
<div aria-hidden="true" class="aurora-container" data-purpose="visual-mesh-backdrop">
<div class="aurora-ribbon-1"></div>
<div class="aurora-ribbon-2"></div>
<div class="aurora-glow-soft"></div>
<!-- Fine SVG curved contour line overlay simulating refractive glass ripples -->
<svg class="absolute right-0 top-0 h-full w-3/4 opacity-30 mix-blend-overlay pointer-events-none" fill="none" viewbox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">
<path d="M400 -100 C700 300 950 650 600 1100" stroke="url(#lineGradient)" stroke-dasharray="8 6" stroke-width="2.5"></path>
<path d="M250 -50 C600 350 850 600 450 1150" opacity="0.6" stroke="white" stroke-width="1.8"></path>
<defs>
<lineargradient id="lineGradient" x1="0%" x2="100%" y1="0%" y2="100%">
<stop offset="0%" stop-color="#38bdf8"></stop>
<stop offset="50%" stop-color="#3b82f6"></stop>
<stop offset="100%" stop-color="#c084fc"></stop>
</lineargradient>
</defs>
</svg>
</div>
<!-- END: Ambient Background Graphics -->
<!-- BEGIN: Header Navigation Minimal -->
<header class="relative z-10 w-full px-8 py-6 max-w-7xl mx-auto flex items-center justify-between" data-purpose="top-navigation">
<div class="flex items-center space-x-2 text-xs font-semibold tracking-wider uppercase text-slate-500">
<span class="inline-block w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
<span>Enterprise Cloud Region: us-east-1</span>
</div>
<div class="text-xs text-slate-500 font-medium hidden sm:flex items-center gap-4">
<a class="hover:text-slate-900 transition-colors" href="#help">Help Center</a>
<span>•</span>
<a class="hover:text-slate-900 transition-colors" href="#system-status">System Status</a>
</div>
</header>
<!-- END: Header Navigation Minimal -->
<!-- BEGIN: Main Content Area -->
<main class="relative z-10 flex-grow flex items-center justify-center px-4 sm:px-6 lg:px-8 py-8" data-purpose="auth-view">
<div class="w-full max-w-[440px] bg-white/95 backdrop-blur-md p-8 sm:p-10 rounded-2xl shadow-xl shadow-slate-200/60 border border-slate-100">
<!-- ErgonX Brand Identification -->
<div class="flex items-center gap-2 mb-8" data-purpose="brand-logo">
<span class="text-3xl sm:text-4xl font-black tracking-tight text-slate-900 font-sans">
          Ergon<span class="relative inline-block font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-sky-400 via-cyan-400 to-blue-600">X</span>
</span>
</div>
<!-- Welcome Heading & Context -->
<div class="mb-7" data-purpose="login-header">
<h1 class="text-2xl sm:text-[28px] font-bold tracking-tight text-slate-900 leading-snug">
          Welcome back
        </h1>
<p class="mt-1.5 text-sm text-slate-500 leading-relaxed">
          Sign in to continue to your ErgonX workspace.
        </p>
</div>
<!-- Authentication Form -->
<form action="#" class="space-y-5" data-purpose="signin-form" method="POST" onsubmit="event.preventDefault();">
<!-- Email Field Group -->
<div data-purpose="email-field-group">
<label class="block text-xs font-semibold text-slate-800 uppercase tracking-wide mb-1.5" for="email">
            Email address
          </label>
<div class="auth-input-container relative flex items-center rounded-xl border border-slate-300 bg-white shadow-sm overflow-hidden">
<div aria-hidden="true" class="pl-3.5 pr-2 text-slate-400 flex items-center pointer-events-none">
<!-- Mail Outline Icon -->
<svg class="w-5 h-5 text-slate-400" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path>
</svg>
</div>
<input autocomplete="email" class="w-full py-3 pr-3.5 pl-1 border-0 focus:ring-0 text-slate-900 placeholder:text-slate-400 text-sm font-normal bg-transparent" id="email" name="email" placeholder="name@company.com" required="" type="email"/>
</div>
</div>
<!-- Password Field Group -->
<div data-purpose="password-field-group">
<div class="flex items-center justify-between mb-1.5">
<label class="text-xs font-semibold text-slate-800 uppercase tracking-wide" for="password">
              Password
            </label>
<a class="text-xs font-medium text-blue-600 hover:text-blue-700 hover:underline transition-colors focus:outline-none focus:underline" data-purpose="forgot-password-link" href="#forgot-password">
              Forgot password?
            </a>
</div>
<div class="auth-input-container relative flex items-center rounded-xl border border-slate-300 bg-white shadow-sm overflow-hidden">
<div aria-hidden="true" class="pl-3.5 pr-2 text-slate-400 flex items-center pointer-events-none">
<!-- Lock Outline Icon -->
<svg class="w-5 h-5 text-slate-400" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path>
</svg>
</div>
<input autocomplete="current-password" class="w-full py-3 pr-2 pl-1 border-0 focus:ring-0 text-slate-900 placeholder:text-slate-400 text-sm font-normal tracking-widest bg-transparent" id="password" name="password" required="" type="password" value="SecurePass123"/>
<!-- Password Visibility Toggle Button -->
<button aria-label="Toggle password visibility" class="p-2 mr-1.5 text-slate-400 hover:text-slate-600 focus:outline-none transition-colors" data-purpose="password-visibility-toggle" id="toggle-password" type="button">
<svg class="w-5 h-5" fill="none" id="eye-icon" stroke="currentColor" viewbox="0 0 24 24">
<path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path>
<path d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path>
</svg>
</button>
</div>
</div>
<!-- Submit CTA Button -->
<div class="pt-2">
<button class="group w-full flex items-center justify-center gap-2 py-3 px-5 rounded-xl text-white font-medium text-sm bg-brand-dark hover:bg-brand-hover active:scale-[0.99] transition-all duration-150 shadow-md hover:shadow-lg focus:ring-4 focus:ring-slate-300 outline-none" data-purpose="submit-button" id="signin-btn" type="submit">
<span>Sign in</span>
<!-- Trailing arrow icon matching source design -->
<svg class="w-4 h-4 transition-transform group-hover:translate-x-0.5" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M14 5l7 7m0 0l-7 7m7-7H3" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</button>
</div>
</form>
<!-- Institutional Sign-up Referral Link -->
<div class="mt-8 text-center" data-purpose="registration-cta">
<p class="text-sm text-slate-500">
          New to ErgonX? 
          <a class="font-medium text-blue-600 hover:text-blue-800 underline decoration-blue-500/40 underline-offset-4 hover:decoration-blue-700 transition-colors" href="#register">
            Get started
          </a>
</p>
</div>
</div>
</main>
<!-- END: Main Content Area -->
<!-- BEGIN: Footer Compliance and Security Badging -->
<footer class="relative z-10 w-full py-6 text-center text-xs text-slate-400" data-purpose="page-footer">
<div class="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-center gap-3">
<div class="flex items-center gap-1.5 font-medium text-slate-500">
<svg class="w-3.5 h-3.5 text-emerald-500 inline-block" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
<span>256-bit TLS encrypted</span>
</div>
<span class="hidden sm:inline text-slate-300">•</span>
<div>ISO 27001 &amp; SOC 2 Type II certified</div>
<span class="hidden sm:inline text-slate-300">•</span>
<div class="space-x-3 text-slate-400">
<a class="hover:underline" href="#privacy">Privacy Policy</a>
<a class="hover:underline" href="#terms">Terms of Service</a>
</div>
</div>
</footer>
<!-- END: Footer Compliance and Security Badging -->
<!-- BEGIN: Interactive Client Logic -->
<script data-purpose="password-visibility-handler">
    document.addEventListener('DOMContentLoaded', () => {
      const toggleBtn = document.getElementById('toggle-password');
      const passwordInput = document.getElementById('password');

      if (toggleBtn && passwordInput) {
        toggleBtn.addEventListener('click', () => {
          const isPassword = passwordInput.getAttribute('type') === 'password';
          passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
          
          // Toggle tracking class for visual dots in password mode
          if (isPassword) {
            passwordInput.classList.remove('tracking-widest');
          } else {
            passwordInput.classList.add('tracking-widest');
          }
        });
      }
    });
  </script>
<!-- END: Interactive Client Logic -->
</body></html>
