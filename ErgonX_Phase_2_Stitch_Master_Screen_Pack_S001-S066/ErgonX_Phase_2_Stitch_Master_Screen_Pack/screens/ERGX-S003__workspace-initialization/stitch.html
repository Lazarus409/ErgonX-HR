<html lang="en"><head>

<!-- Tailwind CSS CDN with forms and container queries -->

<!-- Tailwind Custom Configuration -->
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              navy: '#051937',
              deepBlue: '#002855',
              indigo: '#2548cc',

<!-- BEGIN: Ambient Background Styles -->
<style data-purpose="ambient-canvas">
    /* Base Background Canvas */
    body {
      background-color: #FFFFFF;
      overflow: hidden;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    /* Soft curved organic ambient light waves replicating the splash screen artwork */
    .ambient-light-container {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 1;
    }

    /* Left Light Ribbon Layer */
    .wave-left {
      position: absolute;
      width: 60vw;
      height: 120vh;
      top: -10vh;
      left: -20vw;
      background: radial-gradient(ellipse 65% 55% at 40% 50%, rgba(0, 210, 255, 0.22) 0%, rgba(58, 123, 213, 0.16) 45%, rgba(200, 240, 255, 0.08) 75%, transparent 100%);
      filter: blur(55px);
      border-radius: 48% 52% 45% 55% / 40% 60% 40% 60%;
      transform: rotate(-12deg);
      animation: floatLeft 16s ease-in-out infinite alternate;
    }

    /* Right Light Ribbon Layer */
    .wave-right {
      position: absolute;
      width: 65vw;
      height: 130vh;
      top: -15vh;
      right: -22vw;
      background: radial-gradient(ellipse 70% 60% at 60% 45%, rgba(0, 210, 255, 0.24) 0%, rgba(99, 102, 241, 0.14) 45%, rgba(186, 230, 253, 0.07) 80%, transparent 100%);
      filter: blur(60px);
      border-radius: 52% 48% 60% 40% / 55% 45% 55% 45%;
      transform: rotate(16deg);
      animation: floatRight 18s ease-in-out infinite alternate;
    }

    /* Secondary subtle curved accents creating translucent lens arches */
    .wave-center-accent {
      position: absolute;
      width: 90vw;
      height: 50vh;
      bottom: -15vh;
      left: 5vw;
      background: radial-gradient(ellipse 80% 40% at 50% 80%, rgba(224, 247, 255, 0.6) 0%, rgba(240, 249, 255, 0.2) 60%, transparent 100%);
      filter: blur(45px);
    }

    /* Ambient float animations */
    @keyframes floatLeft {
      0% { transform: rotate(-12deg) translateY(0px) scale(1); }
      100% { transform: rotate(-8deg) translateY(-25px) scale(1.04); }
    }

    @keyframes floatRight {
      0% { transform: rotate(16deg) translateY(0px) scale(1); }
      100% { transform: rotate(20deg) translateY(30px) scale(1.05); }
    }
  </style>
<!-- END: Ambient Background Styles -->
<!-- BEGIN: Loading & Interactive Animation Styles -->
<style data-purpose="loading-animations">
    /* Progress capsule track */
    .progress-track {
      position: relative;
      height: 4.5px;
      width: 250px;
      background-color: rgba(226, 232, 240, 0.65);
      border-radius: 9999px;
      overflow: hidden;
      backdrop-filter: blur(4px);
    }

    /* Moving gradient light pulse */
    .progress-indicator {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 50%;
      background: linear-gradient(90deg, rgba(0, 210, 255, 0) 0%, #00d2ff 25%, #2548cc 60%, #9055ff 88%, rgba(144, 85, 255, 0) 100%);
      border-radius: 9999px;
      animation: indeterminateLoading 1.8s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      box-shadow: 0 0 14px rgba(0, 210, 255, 0.65);
    }

    @keyframes indeterminateLoading {
      0% {
        left: -50%;
        transform: scaleX(0.7);
      }
      50% {
        transform: scaleX(1.1);
      }
      100% {
        left: 105%;
        transform: scaleX(0.8);
      }
    }

    /* Logo geometric butterfly bloom effect */
    .logo-bloom {
      filter: drop-shadow(0 4px 16px rgba(0, 210, 255, 0.35));
    }
  </style>
<!-- END: Loading & Interactive Animation Styles -->
</head>

<!-- BEGIN: Realistic Boot Sequence Cycling Script -->
<script data-purpose="workspace-status-cycler">
    // Simulates live startup phase status transitions for enterprise ERP environment
    document.addEventListener('DOMContentLoaded', () => {
      const statusElement = document.getElementById('dynamicStatusText');
      if (!statusElement) return;

      const bootPhases = [
        "Connecting to Rivermere University (Cluster: AF-WEST-1) • Verifying security certificates...",
        "Authorizing token session • Loading user schema and role matrix...",
        "Synchronizing financial ledger cache & local indexed datastores...",
        "Instantiating customized workflow modules & workspace canvas...",
        "Ready. Finalizing UI layout presentation..."
      ];

      let currentStep = 0;
      const intervalTimer = setInterval(() => {
        currentStep++;
        if (currentStep < bootPhases.length) {
          statusElement.style.opacity = '0';
          setTimeout(() => {
            statusElement.textContent = bootPhases[currentStep];
            statusElement.style.opacity = '1';
          }, 220);
        } else {
          clearInterval(intervalTimer);
        }
      }, 2600);
    });
  </script>
<!-- END: Realistic Boot Sequence Cycling Script -->
</body></html>
