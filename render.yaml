# ErgonX HR on free tiers: two free Render web services and an external free
# PostgreSQL database (for example Neon). Free web services sleep after 15 minutes
# without traffic and take about a minute to wake on the next request.
# The hourly approval-reminder cron job is not included because Render cron jobs
# are always billed; reminders still appear in the app's approvals inbox.
services:
  - type: web
    runtime: docker
    plan: free
    name: ergonx-hr-api
    dockerfilePath: Ergonx-backend/Dockerfile
    dockerContext: Ergonx-backend
    healthCheckPath: /api/v1/schema/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DJANGO_SECRET_KEY
        generateValue: true
      # Paste the ErgonX HR database connection string, e.g. Neon's
      # postgresql://user:password@ep-....neon.tech/ergonx_hr?sslmode=require
      - key: DATABASE_URL
        sync: false
      # A sleeping free database can take a few seconds to wake.
      - key: POSTGRES_CONNECT_TIMEOUT
        value: "15"
      # ErgonX HR edition: these modules are never enabled and their API is not mounted.
      - key: ERGONX_EXCLUDED_MODULES
        value: PAYROLL,ACCOUNTING
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: FRONTEND_PUBLIC_URL
        sync: false
      - key: EMAIL_DELIVERY_ENABLED
        value: "false"
      - key: JWT_ACCESS_MINUTES
        value: "15"
      - key: JWT_REFRESH_DAYS
        value: "7"
      # Shared with ergonx-hr-web: lets the BFF forward the browser IP for per-IP
      # sign-in limits and audit records. Generated once here, read by the web service.
      - key: BFF_PROXY_SECRET
        generateValue: true

  - type: web
    runtime: docker
    plan: free
    name: ergonx-hr-web
    dockerfilePath: ergonx-frontend/Dockerfile
    dockerContext: ergonx-frontend
    envVars:
      - key: ERGONX_API_PROXY_URL
        sync: false
      - key: NEXT_PUBLIC_API_BASE_URL
        sync: false
      - key: NEXT_PUBLIC_ENABLE_DEV_AUTH_BYPASS
        value: "false"
      - key: BFF_PROXY_SECRET
        fromService:
          type: web
          name: ergonx-hr-api
          envVarKey: BFF_PROXY_SECRET
